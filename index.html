<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
 
    <link rel="stylesheet" href="styles.css">
</head>
 
<body>
 
    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
    </header>
 
    <main>
        <section aria-labelledby="filtros-titulo">
            <h2 id="filtros-titulo">Busca e Filtros</h2>
            <form action="#" method="get">
 
                <div>
                    <label for="busca-titulo">Buscar por título da tarefa:</label>
                    <input type="search" id="busca-titulo" name="busca">
                </div>
 
                <fieldset>
                    <legend>Filtro por Status</legend>
                    <ul>
                        <li>
                            <input type="radio" id="status-todos" name="status" value="todos" checked>
                            <label for="status-todos">Todos</label>
                        </li>
                        <li>
                            <input type="radio" id="status-fazer" name="status" value="a-fazer">
                            <label for="status-fazer">A Fazer</label>
                        </li>
                        <li>
                            <input type="radio" id="status-andamento" name="status" value="em-andamento">
                            <label for="status-andamento">Em Andamento</label>
                        </li>
                        <li>
                            <input type="radio" id="status-revisao" name="status" value="em-revisao">
                            <label for="status-revisao">Em Revisão</label>
                        </li>
                        <li>
                            <input type="radio" id="status-concluida" name="status" value="concluida">
                            <label for="status-concluida">Concluída</label>
                        </li>
                    </ul>
                </fieldset>
 
                <fieldset>
                    <legend>Filtro por Prioridade</legend>
                    <ul>
                        <li>
                            <input type="radio" id="prioridade-todas" name="prioridade" value="todas" checked>
                            <label for="prioridade-todas">Todas</label>
                        </li>
                        <li>
                            <input type="radio" id="prioridade-baixa" name="prioridade" value="baixa">
                            <label for="prioridade-baixa">Baixa</label>
                        </li>
                        <li>
                            <input type="radio" id="prioridade-media" name="prioridade" value="media">
                            <label for="prioridade-media">Média</label>
                        </li>
                        <li>
                            <input type="radio" id="prioridade-alta" name="prioridade" value="alta">
                            <label for="prioridade-alta">Alta</label>
                        </li>
                    </ul>
                </fieldset>
 
                <button type="submit">Aplicar filtros</button>
            </form>
        </section>
 
        <section aria-labelledby="quadro-titulo">
            <h2 id="quadro-titulo">Quadro de Tarefas</h2>
 
            <p id="status-mensagem" role="status" aria-live="polite"></p>
 
            <section aria-labelledby="coluna-fazer">
                <h3 id="coluna-fazer">A Fazer</h3>
                <ul id="lista-a-fazer"></ul>
            </section>
 
            <section aria-labelledby="coluna-andamento">
                <h3 id="coluna-andamento">Em Andamento</h3>
                <ul id="lista-em-andamento"></ul>
            </section>
 
            <section aria-labelledby="coluna-revisao">
                <h3 id="coluna-revisao">Em Revisão</h3>
                <ul id="lista-em-revisao"></ul>
            </section>
 
            <section aria-labelledby="coluna-concluida">
                <h3 id="coluna-concluida">Concluída</h3>
                <ul id="lista-concluida"></ul>
            </section>
        </section>
    </main>
 
    <footer>
        <p>Desenvolvido por: Felipe</p>
        <p>Desenvolvimento Frontend</p>
    </footer>
 
    <script type="module" src="js/main.js"></script>
</body>
 
</html>
